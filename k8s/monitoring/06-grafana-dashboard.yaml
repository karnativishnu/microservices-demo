apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard
  namespace: microservices-demo
data:
  microservices-demo.json: |
    {
      "uid": "microservices-demo",
      "title": "Microservices Demo",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "15s",
      "time": {"from": "now-30m", "to": "now"},
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "HTTP Request Rate",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [{"expr": "sum by (app) (rate(http_server_requests_seconds_count{namespace=\"microservices-demo\"}[5m]))", "legendFormat": "{{app}}"}],
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []}
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "JVM Memory Used",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [{"expr": "sum by (app) (jvm_memory_used_bytes{namespace=\"microservices-demo\"})", "legendFormat": "{{app}}"}],
          "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []}
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Service Instances",
          "gridPos": {"h": 6, "w": 8, "x": 0, "y": 8},
          "targets": [{"expr": "count(up{namespace=\"microservices-demo\",app=~\"inventory-service|order-service|api-gateway\"})"}],
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "JVM Process Uptime",
          "gridPos": {"h": 6, "w": 16, "x": 8, "y": 8},
          "targets": [{"expr": "process_uptime_seconds{namespace=\"microservices-demo\"}", "legendFormat": "{{app}}"}],
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []}
        }
      ]
    }
