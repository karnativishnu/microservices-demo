apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: microservices-demo
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: microservices-demo
        orgId: 1
        folder: Microservices Demo
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
